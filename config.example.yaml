# 用户指定的本地聚合服务。local 是无鉴权本地网关的占位值，不是真实密钥。
# 若服务启用了鉴权，把 api_key 改成 ${GEOH_API_KEY}，在配置同目录 .env 中设置。
model: cbcn/deepseek-v4.1-flash(max)
base_url: http://localhost:20128/v1
api_key: local
mcp: {}
agent:
  max_tokens: 16384
  reasoning_effort: max
  task_budget_seconds: 1200  # Task target, not a hard interruption of atomic writes.
  delivery_reserve_seconds: 180
  # Continue exhausted batches when successful tool results show new progress.
  auto_continue: true
  # Set false only if the provider rejects stream_options.include_usage.
  include_stream_usage: true
  request_extra_body: {}
  # An explicit reasoning_effort keeps main/recovery model and effort identical.
  # Alternative recovery remains available when reasoning_effort is unset.
  empty_response_retries: 1
  empty_response_fallback_model: ""
  empty_response_fallback_extra_body: {}
  # Recovery does not increase the main request's token limit.
  empty_response_max_tokens: 8192
data:
  file_dir: .
cartography:
  static_renderer: matplotlib
  jobs_dir: .geoharness/maps  # Stable map job receipts inside the current workspace
  minimum_span_geographic: 0.02
  minimum_span_projected: 1000
  extent_padding: 0.05
  outputs_dir: exports
  bridge_rules:
    impact:
      render_method: categorized
      color_scheme: Set1
      n_classes: 2
analysis:
  outputs_dir: .geoharness/analysis
  metric_crs: ""
  timeout_seconds: 120
execution:
  enabled: true
  outputs_dir: .geoharness/runs
  timeout_seconds: 120
  max_output_chars: 12000
publication:
  max_attempts: 4
  retry_delay_seconds: 0.1
qgis:
  enabled: true
  # Empty paths discover an independently installed QGIS; set install_dir if needed.
  install_dir: ""
  python_executable: ""
  prefix_path: ""
  outputs_dir: .geoharness/qgis
  timeout_seconds: 180
  max_output_chars: 12000
  max_search_results: 20
map_review:
  enabled: true
  model: cbcn/deepseek-v4.1-flash(max)
  # Independently configurable; empty fields reuse the corresponding main setting.
  base_url: ""
  api_key: ""  # May also use ${GEOH_REVIEW_API_KEY} from your private .env.
  reasoning_effort: max
  response_format: tool  # tool=function calling; json=JSON text (json_object support needed).
  # geo_map_review only reads images and reports findings; it never repairs or rebuilds.
  # Map generation and review have no version/count/cumulative-time budget.
  # Legacy max_repairs/max_reviews_per_request/total_timeout_seconds are ignored.
  timeout_seconds: 180  # Total image preparation + streamed generation deadline.
  read_timeout_seconds: 90  # Network idle limit; active thinking may exceed this duration.
  max_tokens: 131072  # Includes thinking and final findings; bounded by the total deadline.
  diagnostics_max_chars: 2048
  # Temporarily cache retryable service failures; Retry-After may extend this cooldown.
  service_failure_ttl_seconds: 60
  max_validation_errors: 12
  request_extra_body: {}
  layout:
    legend_outside: true
delivery:
  outputs_dir: exports
