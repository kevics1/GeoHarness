# 用户指定的本地聚合服务。local 是无鉴权本地网关的占位值，不是真实密钥。
# 若服务启用了鉴权，把 api_key 改成 ${GEOH_API_KEY}，在配置同目录 .env 中设置。
model: cbcn/deepseek-v4.1-flash(max)
base_url: http://localhost:20128/v1
api_key: local
mcp: {}
agent:
  max_tokens: 16384
data:
  file_dir: .
cartography:
  outputs_dir: exports
  bridge_rules:
    impact:
      render_method: categorized
      color_scheme: Set1
      n_classes: 2
analysis:
  outputs_dir: .geoharness/analysis
  metric_crs: ""
  timeout_seconds: 120
execution:
  enabled: true
  outputs_dir: .geoharness/runs
  timeout_seconds: 120
  max_output_chars: 12000
qgis:
  enabled: true
  # Empty paths discover an independently installed QGIS; set install_dir if needed.
  install_dir: ""
  python_executable: ""
  prefix_path: ""
  outputs_dir: .geoharness/qgis
  timeout_seconds: 180
  max_output_chars: 12000
  max_search_results: 20
map_review:
  enabled: true
  model: cbcn/deepseek-v4.1-flash(none)
  max_repairs: 2
  max_reviews_per_request: 4
  total_timeout_seconds: 120
  timeout_seconds: 45
  max_tokens: 4096
  request_extra_body:
    thinking:
      type: disabled
  layout:
    legend_outside: true
delivery:
  outputs_dir: exports
